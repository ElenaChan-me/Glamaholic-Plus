name: Build

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Dalamud の参照ライブラリは公式配布物から取得する
      - name: Download Dalamud
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "dalamud"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip" -OutFile "$dir\latest.zip"
          Expand-Archive "$dir\latest.zip" -DestinationPath "$dir\lib" -Force
          "DALAMUD_LIB=$dir\lib\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build Glamaholic.sln -c Release -p:DalamudLibPath="${{ env.DALAMUD_LIB }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GlamaholicJP
          path: Glamaholic/bin/x64/Release/GlamaholicJP/latest.zip
          if-no-files-found: error
